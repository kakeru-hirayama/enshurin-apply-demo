<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京大学演習林　利用申込</title>
<style>
  :root{
    --green:#2C5530; --green-mid:#4A7A4A; --green-pale:#EDF3ED;
    --navy:#1F3864; --gray:#666; --line:#DDE2DD; --pale:#F7F9F7;
    --accent:#B02418; --accent-pale:#FBEDEC;
    --bg:#fff; --fg:#222;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    color:var(--fg); background:#F4F6F4; font-size:15px; line-height:1.75;

    /* ★Apps Script は、この画面を高さの決まった枠（iframe）の中に置く。
         枠は中身の長さに合わせて伸びないため、
         小さい画面では下半分に手が届かなくなる。
         （2026-08-20  ウィンドウ 638×670 で「次へ」が押せない状態を確認）

         枠が伸びないなら、こちらの中でスクロールできるようにする。 */
    height:100vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  header{background:var(--green); color:#fff; padding:14px 20px}
  header h1{font-size:17px; margin:0; font-weight:600}
  header .sub{font-size:12px; opacity:.8; margin-top:2px}
  header .hrow{display:flex; align-items:flex-start;
               justify-content:space-between; gap:14px; flex-wrap:wrap}
  header .hlogin{font-size:12.5px; text-align:right; line-height:1.9}
  header .hlogin button{
    background:rgba(255,255,255,.16); color:#fff;
    border:1px solid rgba(255,255,255,.4);
    border-radius:4px; padding:4px 12px; font-size:12.5px; cursor:pointer;
    font-family:inherit; margin-left:6px;
  }
  header .hlogin button:hover{background:rgba(255,255,255,.28)}
  header .hlogin .who{opacity:.92}
  table.my{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
  table.my th{background:#EDF1ED; text-align:left; padding:7px 9px;
              border-bottom:1px solid var(--line); font-weight:600}
  table.my td{padding:7px 9px; border-bottom:1px solid var(--line);
              vertical-align:top}
  table.my td.nw{white-space:nowrap}

  .wrap{max-width:820px; margin:0 auto; padding:20px 16px 70px}

  /* 進み具合 */
  .steps{display:flex; margin:0 0 22px; background:#fff; border:1px solid var(--line);
         border-radius:5px; overflow:hidden}
  .steps div{
    flex:1; padding:9px 6px; text-align:center; font-size:12px; color:var(--gray);
    border-right:1px solid var(--line); position:relative;
  }
  .steps div:last-child{border-right:none}
  .steps div.on{background:var(--green); color:#fff; font-weight:600}
  .steps div.done{background:var(--green-pale); color:var(--green)}
  .steps .n{
    display:inline-block; width:18px; height:18px; line-height:18px; border-radius:50%;
    background:#DDD; color:#fff; font-size:11px; margin-right:5px;
  }
  .steps div.on .n{background:#fff; color:var(--green)}
  .steps div.done .n{background:var(--green-mid)}

  .card{background:#fff; border:1px solid var(--line); border-radius:5px;
        padding:20px 22px; margin-bottom:16px}
  .card h2{font-size:16px; color:var(--green); margin:0 0 4px; font-weight:600}
  .card .lead{font-size:13px; color:var(--gray); margin:0 0 16px}

  label.f{display:block; margin-bottom:14px}
  label.f .t{display:block; font-size:13px; font-weight:600; margin-bottom:3px}
  label.f .t .req{color:var(--accent); font-size:11px; margin-left:5px}
  label.f .h{display:block; font-size:11.5px; color:var(--gray); margin-bottom:4px}
  input[type=text], input[type=email], input[type=date], input[type=number],
  select, textarea{
    width:100%; padding:8px 10px; border:1px solid #C8CFC8; border-radius:4px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--green-mid); box-shadow:0 0 0 2px var(--green-pale);
  }
  textarea{min-height:76px; resize:vertical}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px}

  .btn{
    padding:10px 22px; border:none; border-radius:4px; cursor:pointer;
    font-size:14px; font-family:inherit; font-weight:600;
  }
  .btn.p{background:var(--green); color:#fff}
  .btn.p:hover{background:#234425}
  .btn.s{background:#fff; color:var(--green); border:1px solid var(--green-mid)}
  .btn.s:hover{background:var(--green-pale)}
  .btn:disabled{background:#CCC; cursor:not-allowed}
  .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px}

  table{border-collapse:collapse; width:100%; font-size:13.5px}
  th{background:var(--green-pale); color:var(--green); padding:7px 9px;
     text-align:left; font-size:12px; font-weight:600}
  td{padding:7px 9px; border-bottom:1px solid var(--line)}

  .msg{padding:10px 13px; border-radius:4px; font-size:13px; margin-bottom:14px}
  .msg.ok{background:var(--green-pale); border:1px solid var(--green-mid); color:var(--green)}
  .msg.warn{background:#FFF8E6; border:1px solid #C9A227; color:#7A6114}
  .msg.err{background:var(--accent-pale); border:1px solid var(--accent); color:var(--accent)}

  .forms li{margin-bottom:9px; list-style:none}
  .forms{padding:0; margin:0}
  .forms .code{
    display:inline-block; background:var(--green); color:#fff; font-size:11px;
    padding:1px 7px; border-radius:3px; margin-right:7px; min-width:30px; text-align:center;
  }
  .forms .dl{font-size:12px; color:var(--gray); margin-left:6px}
  .forms .dl.near{color:var(--accent); font-weight:600}
  .forms .same{
    font-size:11px; color:var(--gray); background:var(--pale);
    padding:1px 6px; border-radius:3px; margin-left:6px;
  }

  .note{font-size:12px; color:var(--gray); margin-top:8px; line-height:1.7}
  .hl{background:#FFF8E6; padding:2px 5px; border-radius:2px}
  .drop{border:2px dashed var(--line); border-radius:6px; padding:26px;
        text-align:center; color:var(--gray); font-size:13px; cursor:pointer;
        transition:.15s; background:#FAFCFA}
  .drop:hover{border-color:var(--green-mid); background:var(--green-pale)}
  .drop.over{border-color:var(--green); background:var(--green-pale);
             color:var(--green)}
  .files{margin-top:14px}
  .files .f{display:flex; align-items:center; gap:10px; padding:8px 11px;
            border:1px solid var(--line); border-radius:4px; margin-bottom:6px;
            font-size:13px; background:#fff}
  .files .f .nm{flex:1; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap}
  .files .f .sz{color:var(--gray); font-size:11.5px; white-space:nowrap}
  .files .f .st{font-size:11.5px; white-space:nowrap}
  .files .f.ok .st{color:var(--green-mid)}
  .files .f.ng{border-color:var(--accent); background:var(--accent-pale)}
  .files .f.ng .st{color:var(--accent)}
  .files .f .x{cursor:pointer; color:var(--gray); padding:0 4px}
  .files .f .x:hover{color:var(--accent)}
  .devnote{
    margin-top:22px; padding:11px 13px; background:#fff;
    border:1px dashed var(--line); border-radius:4px;
    font-size:11.5px; color:var(--gray); line-height:1.8;
  }
  .devnote b{color:var(--green)}

  /* 入力欄の下に出す小さな添え書き。日付の読み方など */
  .hint{
    display:block; font-size:12px; color:var(--gray);
    margin-top:3px; line-height:1.5;
  }

  /* ★試作の説明。本番では showDevNotes を false にすると消える */
  body.hide-dev .devnote{display:none}
  @media(max-width:640px){ .row,.row3{grid-template-columns:1fr} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1>東京大学演習林　利用申込</h1>
      <div class="sub" id="hsub">試作　実際の送信は行いません</div>
    </div>
    <div class="hlogin" id="hlogin"></div>
  </div>
</header>

<div class="wrap">
  <div class="steps" id="steps"></div>
  <div id="view"></div>
</div>

<script>
/* 改行。文字列の中に直接書くと、生成の過程で壊れることがある */
if (typeof NL === "undefined") var NL = String.fromCharCode(10);
</script>
<script src="../api/schema.js"></script>
<script src="../api/adapter_memory.js"></script>
<script src="../api/api.js"></script>
<script src="../api/deadline.js"></script>
<script src="../api/auth.js"></script>
<script src="../api/upload.js"></script>
<script src="_login.js"></script>
<script src="../api/seed_public.js"></script>
<script src="../api/forms_seed.js"></script>
<script>
/* ------------------------------------------------------------------
   利用者側の画面

   ★職員側と同じ API 層を使っている。データも共通。
     違うのは、どの関数を呼ぶかと、何を見せるかだけである。
------------------------------------------------------------------ */

if (typeof FORMS_SEED !== 'undefined') SEED.M_FORM = FORMS_SEED;
loadSeed(MemoryAdapter);

var S = {
  step: 1,
  forest: 'HKD',
  draft: {
    forest_id:'HKD', purpose:'', category:'研究', place:'',
    date_from:'', date_to:'', is_first_of_year:true, is_continuing:false,
    has_lodging:false, has_staff_support:false,
    uav:false, chemicals:false, animals:false, data_use:false, specimen:false
  },
  invites: [],
  appId: null,
  me: null            // 参加者として登録する場面で使う
};

/* 画面に出す文字。生成の途中で壊れないよう、ここにまとめて置く */

var UNDEF = 'undefined';

var HLOGIN = 'hlogin';

var APP = 'app';

var EMPTY = '';

var KIND_USER = 'user';

var TBL_APP = 'T_APPLICATION';

var SPAN_WHO = '<span class="who">';

var SPAN_SAMA = ' 様</span>';

var SPAN_HINT = '<span class="who">ログインすると、過去の申込を確認できます</span>';

var BTN_MYAPPS = '<button onclick="showMyApps()">これまでの申込</button>';

var BTN_SIGNOUT = '<button onclick="doSignOut()">ログアウト</button>';

var BTN_SIGNIN = '<button onclick="doSignIn()">ログイン</button>';

var TR_OPEN = '<tr>';

var TR_CLOSE = '</tr>';

var TD_OPEN = '<td>';

var TD_NW = '<td class="nw">';

var TD_CLOSE = '</td>';

var RANGE = ' 〜 ';

var CARD_OPEN = '<div class="card">';

var CARD_CLOSE = '</div>';

var H2_OPEN = '<h2>';

var H2_CLOSE = '</h2>';

var MY_APPS_TITLE = 'これまでの申込　';

var KEN = ' 件';

var TABLE_HEAD = '<table class="my"><thead><tr><th>受付番号</th><th>演習林</th><th>期間</th><th>利用目的</th><th>状態</th></tr></thead><tbody>';

var TABLE_TAIL = '</tbody></table>';

var NO_APPS = '<div class="msg">まだ申込がありません。<br>このメールアドレスでお申し込みいただくと、ここに並びます。</div>';

var NEW_BTN = '<div style="margin-top:14px"><button class="btn" onclick="S.step=1;render()">新しく申し込む</button></div>';



var STEPS = ['利用の内容', '参加者', '提出する書類', '確認'];

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function renderSteps(){
  $('steps').innerHTML = STEPS.map(function(t,i){
    var n = i+1;
    var cls = S.step===n ? 'on' : (S.step>n ? 'done' : '');
    return '<div class="'+cls+'"><span class="n">'+n+'</span>'+t+'</div>';
  }).join('');
}

function render(){
  renderLogin();
  renderSteps();
  ({1:step1, 2:step2, 3:step3, 4:step4, 5:done, 9:profile, 8:myApps})[S.step]();
}

/**
 * ヘッダーのログイン欄
 *
 * ★ログインは、申込に必須ではない。
 *   年に1回しか使わない方に、まずアカウントを作らせるのは、
 *   申込をやめる理由を1つ増やすことになる。
 *   「過去の申込が見られる」という利点だけを添える。
 */
function renderLogin(){
  var el = $(HLOGIN);
  if(!el) return;
  var me = (typeof Auth !== UNDEF && Auth.current) ? Auth.current() : null;

  if(me){
    el.innerHTML =
      SPAN_WHO + esc(me.name || me.email) + SPAN_SAMA +
      BTN_MYAPPS + BTN_SIGNOUT;
  }else{
    el.innerHTML = SPAN_HINT + BTN_SIGNIN;
  }
}

function doSignIn(){
  LoginView.open(KIND_USER, function(){ render(); });
}

function doSignOut(){
  if(typeof Auth !== UNDEF && Auth.signOut) Auth.signOut();
  if(S.step === 8) S.step = 1;
  render();
}

function showMyApps(){ S.step = 8; render(); }

/**
 * これまでの申込
 * ★見えるのは自分のものだけ。絞るのはサーバー側で行っている
 */
function myApps(){
  var me = (typeof Auth !== UNDEF && Auth.current) ? Auth.current() : null;
  if(!me){ S.step = 1; render(); return; }

  var all = API.adapter().readAll(TBL_APP) || [];
  var list = all.filter(function(a){ return a.rep_user_id === me.id; });
  list.sort(function(a,b){ return (b.date_from || EMPTY) < (a.date_from || EMPTY) ? -1 : 1; });

  var forests = (API.getMasters().forests || []);
  function forestName(id){
    for(var i=0;i<forests.length;i++){ if(forests[i].forest_id===id) return forests[i].name; }
    return id;
  }

  var rows = list.map(function(a){
    return TR_OPEN +
      TD_NW + esc(a.app_id) + TD_CLOSE +
      TD_NW + esc(forestName(a.forest_id)) + TD_CLOSE +
      TD_NW + esc(a.date_from) + RANGE + esc(a.date_to) + TD_CLOSE +
      TD_OPEN + esc(a.purpose) + TD_CLOSE +
      TD_NW + esc(a.status) + TD_CLOSE +
    TR_CLOSE;
  }).join(EMPTY);

  $(APP).innerHTML =
    CARD_OPEN +
      H2_OPEN + MY_APPS_TITLE + list.length + KEN + H2_CLOSE +
      (list.length ? TABLE_HEAD + rows + TABLE_TAIL : NO_APPS) +
      NEW_BTN +
    CARD_CLOSE;
}

// ============================================ 1　利用の内容
function step1(){
  var forests = API.getMasters().forests;
  var d = S.draft;
  $('view').innerHTML =
  '<div class="card">'+
    '<h2>どの演習林を、いつ利用されますか</h2>'+
    '<p class="lead">入力された内容にあわせて、提出が必要な書類と締切をお知らせします。</p>'+

    '<label class="f"><span class="t">演習林<span class="req">必須</span></span>'+
      '<select onchange="S.draft.forest_id=this.value;S.forest=this.value;render()">'+
        forests.map(function(f){
          return '<option value="'+f.forest_id+'"'+
            (d.forest_id===f.forest_id?' selected':'')+'>'+esc(f.name)+'</option>';
        }).join('')+
      '</select></label>'+

    // ★日付欄の表示の並びは、ブラウザの設定で決まる。
    //   こちらから mm/dd/yyyy を yyyy/mm/dd に変えることはできない。
    //   日本語の画面で月と日が逆に見えると、
    //   9月1日と1月9日を取り違える形の事故になる。
    //   選んだ結果を、和暦まじりでない形で必ず見せる。
    '<div class="row">'+
      '<label class="f"><span class="t">利用開始日<span class="req">必須</span></span>'+
        '<input type="date" lang="ja" value="'+esc(d.date_from)+'" '+
        'onchange="S.draft.date_from=this.value;if(!S.draft.date_to)S.draft.date_to=this.value;render()">'+
        '<span class="hint">'+(d.date_from ? dateJa(d.date_from) : '例　2026-09-01')+'</span></label>'+
      '<label class="f"><span class="t">利用終了日<span class="req">必須</span></span>'+
        '<input type="date" lang="ja" value="'+esc(d.date_to)+'" '+
        'onchange="S.draft.date_to=this.value;render()">'+
        '<span class="hint">'+(d.date_to ? dateJa(d.date_to) : '例　2026-09-03')+'</span></label>'+
    '</div>'+

    '<label class="f"><span class="t">区分<span class="req">必須</span></span>'+
      '<select onchange="S.draft.category=this.value;render()">'+
        OPTIONS.USE_CATEGORY.map(function(c){
          return '<option'+(d.category===c?' selected':'')+'>'+c+'</option>';
        }).join('')+
      '</select></label>'+

    '<label class="f"><span class="t">利用目的<span class="req">必須</span></span>'+
      '<span class="h">研究課題名や実習名など。年報にそのまま掲載されます</span>'+
      '<textarea onchange="S.draft.purpose=this.value">'+esc(d.purpose)+'</textarea></label>'+

    '<label class="f"><span class="t">利用場所</span>'+
      '<input type="text" value="'+esc(d.place)+'" placeholder="林内の調査地など" '+
      'onchange="S.draft.place=this.value"></label>'+
  '</div>'+

  '<div class="card">'+
    '<h2>あてはまるものを選んでください</h2>'+
    '<p class="lead">選んだ内容によって、必要な書類と締切が変わります。</p>'+
    [['is_first_of_year','今年度はじめての利用です'],
     ['is_continuing','昨年度から続いている課題です'],
     ['has_lodging','宿泊します'],
     ['has_staff_support','演習林の職員に案内や送迎をお願いします'],
     ['uav','ドローンを飛ばします'],
     ['animals','脊椎動物を対象とした調査を行います'],
     ['chemicals','化学物質や生物を持ち込みます'],
     ['data_use','演習林が持つデータを使います'],
     ['specimen','標本や試料の提供を受けます']].map(function(x){
      return '<label style="display:block;margin-bottom:7px;font-size:14px;cursor:pointer">'+
        '<input type="checkbox"'+(d[x[0]]?' checked':'')+' '+
        'onchange="S.draft.'+x[0]+'=this.checked;render()" style="width:auto;margin-right:8px">'+
        esc(x[1])+'</label>';
     }).join('')+
  '</div>'+

  previewForms()+

  '<div class="actions">'+
    '<button class="btn p" onclick="goto(2)"'+
      (d.date_from&&d.date_to&&d.purpose?'':' disabled')+'>次へ　参加者の登録</button>'+
  '</div>'+
  devNote('getMasters( ) で演習林と様式を取得し、Deadline.scheduleFor( ) で締切を計算している');
}

/** 入力にあわせて、必要な書類と締切をその場で出す */
function previewForms(){
  var d = S.draft;
  var f0 = API.getMasters(d.forest_id).forests.filter(function(x){
    return x.forest_id === d.forest_id; })[0];

  // ★日付が入るまでは締切を出せない。
  //   だからといって何も出さないと、
  //   「書類の話は結局どこに出るのか」が分からないまま進むことになる。
  //   出せない理由と、出る場所を先に見せる。（2026-08-20 指摘）
  if(!d.date_from){
    return '<div class="card">'+
      '<h2>提出が必要な書類</h2>'+
      '<p class="lead">利用開始日を入れると、'+
        esc(f0 ? f0.name : 'この演習林')+'で必要な書類と、'+
        'それぞれの締切がここに並びます。</p>'+
      '<div class="msg">上の「利用開始日」をご入力ください。</div>'+
    '</div>';
  }

  var forms = API.getMasters(d.forest_id).forms;

  var need = forms.filter(function(f){
    var c = f.condition || '';
    if(/ドローン|無人航空機/.test(c) && !d.uav) return false;
    if(/脊椎動物|野生動物/.test(c) && !d.animals) return false;
    if(/化学物質|持ち込み|持込/.test(c) && !d.chemicals) return false;
    if(/データ/.test(c) && !d.data_use) return false;
    if(/標本|試料/.test(c) && !d.specimen) return false;
    if(/宿泊/.test(c) && !d.has_lodging) return false;
    if(f.doc_type==='参考資料') return false;
    return true;
  });

  var sched = Deadline.scheduleFor(need, {
    use_date: d.date_from, end_date: d.date_to,
    is_first_of_year: d.is_first_of_year, is_continuing: d.is_continuing,
    has_lodging: d.has_lodging, has_staff_support: d.has_staff_support
  }, Deadline.iso(new Date()));

  // 同じファイルにまとまっている書類をたたむ
  var byFile = {};
  sched.forEach(function(s){
    var k = s.file_key || ('_' + s.form_code);
    if(!byFile[k]) byFile[k] = [];
    byFile[k].push(s);
  });

  var late = sched.filter(function(s){ return s.state==='締切を過ぎている'; });
  var early = sched.filter(function(s){ return s.state==='まだ早い'; });

  return '<div class="card">'+
    '<h2>提出が必要な書類　'+sched.length+'点</h2>'+
    '<p class="lead">選ばれた内容から判断しています。</p>'+
    (late.length ? '<div class="msg err">締切を過ぎている書類が '+late.length+
      ' 点あります。演習林にご相談ください。</div>' : '')+
    (early.length ? '<div class="msg warn">'+early.length+

/**
 * 選ばれたファイルを覚えておく
 * ★申込が成立する前に選ばれることがあるため、
 *   いったん手元に持ち、申込ができた時点でまとめて送る。
 */
var Files = (function(){
  var list = [];

  function add(fileList){
    [].slice.call(fileList).forEach(function(f){
      var c = Upload.check(f);
      list.push({ file:f, name:f.name, size:f.size,
                  ok:c.ok, error:c.error, kind:c.kind, sent:false });
    });
    render();
  }

  function remove(i){ list.splice(i,1); render(); }

  function render(){
    var el = document.getElementById('filelist');
    if(!el) return;
    if(!list.length){ el.innerHTML = ''; return; }

    el.innerHTML = list.map(function(f,i){
      return '<div class="f '+(f.ok ? (f.sent?'ok':'') : 'ng')+'">'+
        '<span class="nm">'+esc(f.name)+'</span>'+
        '<span class="sz">'+Upload.mb(f.size)+'</span>'+
        '<span class="st">'+
          (f.ok ? (f.sent ? '送信済み' : (f.kind||'')) : esc(f.error))+
        '</span>'+
        '<span class="x" onclick="Files.remove('+i+')">×</span>'+
      '</div>';
    }).join('');
  }

  function bindDrop(){
    var d = document.getElementById('drop');
    if(!d) return;
    ['dragenter','dragover'].forEach(function(ev){
      d.addEventListener(ev, function(e){
        e.preventDefault(); d.classList.add('over');
      });
    });
    ['dragleave','drop'].forEach(function(ev){
      d.addEventListener(ev, function(e){
        e.preventDefault(); d.classList.remove('over');
      });
    });
    d.addEventListener('drop', function(e){
      if(e.dataTransfer && e.dataTransfer.files) add(e.dataTransfer.files);
    });
  }

  /** 申込ができたら、まとめて送る */
  function flush(appId){
    var target = list.filter(function(f){ return f.ok && !f.sent; });
    if(!target.length) return Promise.resolve([]);
    return Upload.sendAll(appId, target.map(function(f){ return f.file; }),
                          {phase:'利用前', kind:'提出書類'},
                          function(r){
                            list.forEach(function(f){
                              if(f.name === r.name) f.sent = r.ok;
                            });
                            render();
                          });
  }

  function count(){ return list.filter(function(f){ return f.ok; }).length; }

  return { add:add, remove:remove, render:render, bindDrop:bindDrop,
           flush:flush, count:count, list:function(){ return list; } };
})();

/**
 * 2026-09-01 を「2026年9月1日（火）」にする
 * ★入力欄の並びはブラウザ任せになるので、
 *   選んだ結果だけは、誰が見ても同じに読める形で出す。
 */
function dateJa(iso){
  if(!iso) return '';
  var p = String(iso).split('-');
  if(p.length !== 3) return iso;
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  var w = ['日','月','火','水','木','金','土'][d.getDay()];
  return Number(p[0]) + '年' + Number(p[1]) + '月' + Number(p[2]) + '日（' + w + '）';
}
